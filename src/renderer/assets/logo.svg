<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Easey IDE — una "E" fatta di righe di codice, con il cursore che scrive. © 2026 Daniele Gabrovec, licenza MIT. -->
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="luce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sfondo)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#luce)"/>
  <!-- Asta e tre barre della E, arrotondate come righe di un editor -->
  <rect x="128" y="120" width="60" height="272" rx="30" fill="#ffffff"/>
  <rect x="128" y="120" width="252" height="60" rx="30" fill="#ffffff"/>
  <rect x="128" y="226" width="176" height="60" rx="30" fill="#ffffff"/>
  <rect x="128" y="332" width="252" height="60" rx="30" fill="#ffffff"/>
  <!-- Cursore -->
  <rect x="336" y="220" width="30" height="72" rx="12" fill="#fbbf24"/>
</svg>
